[package]
name = "meeting-companion"
version = "0.1.0"
description = "Local AI meeting companion"
edition = "2021"
rust-version = "1.90"
license = "AGPL-3.0-only"
publish = false

[lib]
name = "meeting_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Authenticated encryption of meeting files (RustCrypto, audited); key material is zeroed on drop.
chacha20poly1305 = "0.10"
zeroize = "1"
# Data key in the OS keychain: Secret Service on Linux (pure Rust D-Bus), Keychain on macOS,
# Credential Manager on Windows.
keyring = { version = "3.6", default-features = false, features = ["apple-native", "windows-native", "async-secret-service", "async-io", "crypto-rust"] }
cpal = "0.18"
# whisper.cpp 1.8.3 (whisper-rs-sys 0.15.0). Pinned: it runs on the shared ggml of llama-cpp-sys-2 (below),
# so a new version must be checked with the real speech test first (AGENTS.md, "One ggml").
whisper-rs = "=0.16.0"
# llama.cpp in the app's own process (job 016): CPU only, no `common` (no vendored cpp-httplib), no
# `mtmd`, no dynamic linking or loadable backends, no OpenMP. ggml is not built by the crate: it links
# the one shared ggml that `node scripts/ggml.mjs build` builds from this crate's own tree.
llama-cpp-2 = { version = "=0.1.160", default-features = false, features = ["system-ggml-static"] }
# Its raw bindings, same version and features: the log callbacks and the chat template code without a model.
llama-cpp-sys-2 = { version = "=0.1.160", default-features = false, features = ["system-ggml-static"] }
# Speaker embeddings (k2-fsa, Apache-2.0); only `SpeakerEmbeddingExtractor` is used. Links the prebuilt
# static libraries from the checksum-pinned archive (see .cargo/config.toml, scripts/sherpa-onnx.mjs).
sherpa-onnx = { version = "=2.0.1", default-features = false, features = ["static"] }
# The Claude API client (job 011): blocking, TLS by rustls with the Mozilla roots, gzip and proxy
# features off. Used only in src/engines/claude.rs, and only for https://api.anthropic.com/v1/messages.
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
# The opt-in phone web view (src/phone_view/, job 012): an HTTP/1 server on the tokio runtime Tauri already
# runs, bound to one private IPv4 address only while a person opened it. Server side only, no HTTP client.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1", "service"] }
tokio = { version = "1", features = ["net", "time", "sync", "rt", "rt-multi-thread", "macros"] }
# Lists the local interfaces (and whether each is up) to choose the one private address to bind.
if-addrs = "0.15"
# The QR code for the phone URL, drawn as SVG in the core (Nayuki, MIT, no dependencies).
qrcodegen = "1.8"
# Constant-time comparison of the phone token (RustCrypto; already used by chacha20poly1305).
subtle = "2.6"

# Opens the Omarchy theme files with O_NONBLOCK (job 020), so a FIFO in their place cannot block.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
# Decodes the phone QR code back in tests (dev only).
rqrr = { version = "0.11", default-features = false }
tempfile = "3"


# Dependencies (whisper-rs-sys, cpal, ...) are optimised in dev builds; the app's own code is not.
# The native whisper.cpp build gets CMAKE_BUILD_TYPE=Release from `.cargo/config.toml`.
[profile.dev.package."*"]
opt-level = 3
