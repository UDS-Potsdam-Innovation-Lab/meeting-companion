[package]
name = "meeting-companion"
version = "0.1.0"
description = "Local AI meeting companion"
edition = "2021"
rust-version = "1.90"
license = "UNLICENSED"
publish = false

[lib]
name = "meeting_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Authenticated encryption of meeting files (RustCrypto, audited); key material is zeroed on drop.
chacha20poly1305 = "0.10"
zeroize = "1"
# Data key in the OS keychain: Secret Service on Linux (pure Rust D-Bus), Keychain on macOS,
# Credential Manager on Windows.
keyring = { version = "3.6", default-features = false, features = ["apple-native", "windows-native", "async-secret-service", "async-io", "crypto-rust"] }
cpal = "0.18"
whisper-rs = "0.16"

[dev-dependencies]
tempfile = "3"

# Dependencies (whisper-rs-sys, cpal, ...) are optimised in dev builds; the app's own code is not.
# The native whisper.cpp build gets CMAKE_BUILD_TYPE=Release from `.cargo/config.toml`.
[profile.dev.package."*"]
opt-level = 3
