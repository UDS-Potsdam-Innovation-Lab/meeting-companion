[package]
name = "meeting-companion"
version = "0.1.0"
description = "Local AI meeting companion"
edition = "2021"
rust-version = "1.90"
license = "UNLICENSED"
publish = false

[lib]
name = "meeting_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
