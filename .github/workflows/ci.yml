name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux only for now. macOS and Windows come back once the feature set is final:
        # add macos-latest and windows-latest here (the steps below already handle both).
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Rust (version from rust-toolchain.toml)
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # libasound2-dev: microphone (cpal/ALSA); cmake, clang, libclang-dev: whisper.cpp (whisper-rs).
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev xvfb \
            libasound2-dev cmake clang libclang-dev

      - name: Install npm dependencies
        run: npm ci

      # sherpa-onnx (speaker detection) links prebuilt static libraries. The archive is fetched once,
      # checked against the SHA-256 pinned in src-tauri/native/sherpa-onnx.sha256 and unpacked into
      # src-tauri/native/lib, which .cargo/config.toml makes the only place the build links them from.
      - name: Cache the sherpa-onnx archive
        uses: actions/cache@v4
        with:
          path: src-tauri/native/archive
          key: sherpa-onnx-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src-tauri/native/sherpa-onnx.sha256') }}

      - name: Fetch and verify the sherpa-onnx libraries (pinned SHA-256)
        run: node scripts/sherpa-onnx.mjs fetch

      - name: A corrupted sherpa-onnx archive fails the check
        shell: bash
        run: |
          dir=$(mktemp -d)
          cp src-tauri/native/archive/*.tar.bz2 "$dir/"
          file=$(ls "$dir"/*.tar.bz2)
          printf 'corrupt' | dd of="$file" bs=1 seek=1000 count=7 conv=notrunc status=none
          if node scripts/sherpa-onnx.mjs verify "$file"; then
            echo "a corrupted archive passed the check"
            exit 1
          fi

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Compile the desktop app
        run: npm run tauri build -- --no-bundle

      - name: Smoke test the built app (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/smoke.mjs

      - name: Smoke test the built app
        if: runner.os != 'Linux'
        run: node scripts/smoke.mjs
