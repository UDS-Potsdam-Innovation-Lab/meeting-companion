name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux (x86_64) and macOS (macos-latest, Apple Silicon arm64) on every push and pull request
        # (job 017). Windows comes later: add windows-latest here. Intel Macs are not built.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      # whisper.cpp, onnxruntime (sherpa-onnx), the Tauri app and the Rust cache together outgrow the
      # runner's free disk, and the cache save at the end failed with "No space left on device". The
      # runner image ships toolchains this project never uses; remove them first.
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/share/swift
          sudo docker image prune --all --force
          df -h /

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Rust (version from rust-toolchain.toml)
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # libasound2-dev: microphone (cpal/ALSA); cmake, clang, libclang-dev: whisper.cpp (whisper-rs).
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev xvfb \
            libasound2-dev cmake clang libclang-dev

      - name: Install npm dependencies
        run: npm ci

      # sherpa-onnx (speaker detection) links prebuilt static libraries. The archive is fetched once,
      # checked against the SHA-256 pinned in src-tauri/native/sherpa-onnx.sha256 and unpacked into
      # src-tauri/native/lib, which .cargo/config.toml makes the only place the build links them from.
      - name: Cache the sherpa-onnx archive
        uses: actions/cache@v4
        with:
          path: src-tauri/native/archive
          key: sherpa-onnx-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src-tauri/native/sherpa-onnx.sha256') }}

      - name: Fetch and verify the sherpa-onnx libraries (pinned SHA-256)
        run: node scripts/sherpa-onnx.mjs fetch

      # One ggml for whisper.cpp and llama.cpp (job 016): built once from the ggml tree of the pinned
      # llama-cpp-sys-2, into src-tauri/native/ggml/prefix, which .cargo/config.toml makes the only ggml
      # both crates link. CI builds it for the baseline CPU (GGML_NATIVE=OFF), so a cached copy runs on
      # any runner. It also cleans every output of the two sys crates that the Rust cache restored but that
      # was not built against this prefix (e.g. whisper-rs-sys with its own ggml, in any profile): the
      # release build of run 41334135604 linked such a cached whisper-rs-sys and failed on duplicate symbols.
      - name: Cache the shared ggml
        uses: actions/cache@v4
        with:
          path: src-tauri/native/ggml/prefix
          key: ggml-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src-tauri/Cargo.lock', 'scripts/ggml.mjs', 'src-tauri/native/ggml/CMakeLists.txt', 'src-tauri/native/ggml/whisper-shared-ggml.cmake', 'src-tauri/native/ggml/llama-shared-ggml.cmake') }}

      - name: Build the shared ggml (whisper.cpp and llama.cpp link this one copy)
        shell: bash
        env:
          GGML_NATIVE: "OFF"
        run: |
          node scripts/ggml.mjs build
          node scripts/ggml.mjs verify

      - name: A corrupted sherpa-onnx archive fails the check
        shell: bash
        run: |
          dir=$(mktemp -d)
          cp src-tauri/native/archive/*.tar.bz2 "$dir/"
          file=$(ls "$dir"/*.tar.bz2)
          printf 'corrupt' | dd of="$file" bs=1 seek=1000 count=7 conv=notrunc status=none
          if node scripts/sherpa-onnx.mjs verify "$file"; then
            echo "a corrupted archive passed the check"
            exit 1
          fi

      # The speaker model for the speaker-accuracy run (test only; the app downloads no model). Fetched
      # once, checked against the SHA-256 pinned in src-tauri/native/speaker-model.sha256 and cached by
      # that checksum file. The test itself never downloads.
      - name: Cache the speaker model
        uses: actions/cache@v4
        with:
          path: src-tauri/native/models
          key: speaker-model-${{ hashFiles('src-tauri/native/speaker-model.sha256') }}

      - name: Fetch and verify the speaker model (pinned SHA-256)
        run: node scripts/speaker-model.mjs fetch

      - name: A corrupted speaker model fails the check
        shell: bash
        run: |
          dir=$(mktemp -d)
          cp src-tauri/native/models/*.onnx "$dir/"
          file=$(ls "$dir"/*.onnx)
          printf 'corrupt' | dd of="$file" bs=1 seek=1000 count=7 conv=notrunc status=none
          if node scripts/speaker-model.mjs verify "$file"; then
            echo "a corrupted speaker model passed the check"
            exit 1
          fi
          rm -rf "$dir"

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Test
        if: runner.os == 'Linux'
        run: npm test

      - name: TEMP Test (macOS, level tests measured separately)
        if: runner.os == 'macOS'
        run: npx vitest run && cargo test --manifest-path src-tauri/Cargo.toml -- --skip recording::level_tests && npx playwright test

      # The real speaker model on the test meetings of src-tauri/testdata/speakers, in the debug test
      # profile npm test has just built (no second release build). Fails on a regression against
      # src-tauri/testdata/speakers/thresholds.json.
      - name: Speaker accuracy (real model, regression thresholds)
        shell: bash
        run: |
          export MEETING_COMPANION_SPEAKER_MODEL="$(node scripts/speaker-model.mjs path)"
          cargo test --manifest-path src-tauri/Cargo.toml -- --ignored speaker_accuracy

      # The marker string is compiled into the test build (the check would see it) but must not be in
      # the app: the speaker corpus and its test code stay out of the release binary.
      - name: The corpus marker check finds the marker in the test build
        shell: bash
        run: |
          marker=meeting-companion-speaker-corpus-v1
          if ! grep -l -a "$marker" src-tauri/target/debug/deps/meeting_companion_lib-* | grep -q .; then
            echo "the marker is missing from the test build: the check is broken"
            exit 1
          fi

      - name: Compile the desktop app
        run: npm run tauri build -- --no-bundle

      - name: TEMP record macOS fixtures (nm, lsof)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          echo "===NM-BEGIN"
          nm src-tauri/target/release/meeting-companion | grep -E ' _(ggml|gguf|llama|whisper)_'
          nm src-tauri/target/release/meeting-companion | grep -m5 -E '4ureq'
          echo "===NM-END"
          cat > /tmp/sock.mjs <<'JS'
          import net from "node:net"; import dgram from "node:dgram";
          const mode = process.argv[2];
          if (mode === "tcp") net.createServer().listen(1234);
          if (mode === "udp") dgram.createSocket("udp4").bind(0);
          if (mode === "out") net.connect(443, "github.com");
          setTimeout(() => {}, 5000);
          JS
          for m in none tcp udp out; do
            node /tmp/sock.mjs $m & pid=$!
            sleep 2
            echo "===LSOF-BEGIN $m $pid"
            lsof -a -p $pid -n -P -F ftPnT -Tqs
            echo "===LSOF-END $m"
            kill $pid
          done

      - name: TEMP timer and level-test diagnostics (macOS)
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          cat > /tmp/slp.py <<'PY'
          import time
          for ms in (1, 25, 40):
              t = time.perf_counter()
              for _ in range(40):
                  time.sleep(ms / 1000)
              print(f"sleep {ms} ms -> {(time.perf_counter() - t) / 40 * 1000:.1f} ms")
          PY
          sysctl -n hw.ncpu
          python3 /tmp/slp.py
          echo "--- taskpolicy -l 0 -t 0"
          taskpolicy -l 0 -t 0 python3 /tmp/slp.py || echo "taskpolicy failed"
          echo "--- level tests, serial"
          cargo test --manifest-path src-tauri/Cargo.toml level_tests -- --test-threads=1 2>&1 | tail -30 || echo "level tests failed"
          echo "--- level tests, parallel"
          cargo test --manifest-path src-tauri/Cargo.toml level_tests 2>&1 | tail -30 || echo "level tests failed"
          echo "--- level tests, serial, taskpolicy"
          taskpolicy -l 0 -t 0 cargo test --manifest-path src-tauri/Cargo.toml level_tests -- --test-threads=1 2>&1 | tail -30 || echo "level tests failed"

      # Job 016: exactly one ggml (no symbol of the listed set defined twice), whisper.cpp and llama.cpp
      # both linked, and no cpp-httplib, curl or llama-server code. Reads the symbol table with the system
      # nm: ELF on Linux, Mach-O on macOS (job 017).
      - name: One ggml, both engines and no HTTP client in the release app
        run: node scripts/ggml-check.mjs src-tauri/target/release/meeting-companion

      # Job 017: the binary built without a bundle declares why it uses the microphone (its embedded
      # __TEXT,__info_plist holds NSMicrophoneUsageDescription from src-tauri/Info.plist); without it
      # macOS refuses the capture without asking. The debug build is what `npm run tauri dev` runs.
      - name: The macOS app binaries declare the microphone use (embedded Info.plist)
        if: runner.os == 'macOS'
        run: |
          node scripts/plist-check.mjs src-tauri/target/release/meeting-companion
          cargo build --manifest-path src-tauri/Cargo.toml
          node scripts/plist-check.mjs src-tauri/target/debug/meeting-companion

      - name: The release app holds no speaker corpus
        shell: bash
        run: |
          app=src-tauri/target/release/meeting-companion
          test -f "$app" || app=src-tauri/target/release/meeting-companion.exe
          if grep -q -a meeting-companion-speaker-corpus-v1 "$app"; then
            echo "the release app contains the speaker corpus marker"
            exit 1
          fi

      - name: Smoke test the built app (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/smoke.mjs

      # On macOS the smoke test scans the app's sockets with lsof (job 017).
      - name: Smoke test the built app
        if: runner.os != 'Linux'
        run: node scripts/smoke.mjs

      # The cache is saved after the last step. Leave it room: drop what is rebuilt anyway (the app's
      # own artefacts and the unpacked native libraries; the verified archive stays cached).
      - name: Free disk space before the cache is saved
        if: always()
        shell: bash
        run: |
          rm -rf src-tauri/target/release/meeting-companion src-tauri/target/release/bundle \
            src-tauri/target/*/deps/meeting_companion* src-tauri/target/*/deps/libmeeting_companion* \
            src-tauri/target/*/incremental src-tauri/native/lib dist dist-e2e playwright-report test-results
          df -h /
